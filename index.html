    <script>
      (function() {
        try {
          var _currentFetch = window.fetch ? window.fetch.bind(window) : undefined;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _currentFetch;
            },
            set: function(fn) {
              _currentFetch = fn;
            },
            configurable: true,
            enumerable: true,
          });
        } catch (err) {
          /* ignore */
        }

        window.addEventListener(
          'error',
          function(e) {
            if (
              (e.filename && (e.filename.includes('chrome-extension:') || e.filename.includes('moz-extension:'))) ||
              (e.message && (e.message.includes('chrome-extension:') || e.message.includes('Cannot set property fetch of #<Window>')))
            ) {
              e.stopImmediatePropagation();
              e.preventDefault();
              return true;
            }
          },
          true
        );
      })();
    </script>
